<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blackpool Control CAD</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#0b1722;color:#e8f0f5}.top{height:62px;background:#082f50;display:flex;align-items:center;padding:0 20px}.brand{font-size:20px;font-weight:800}.sub{font-size:11px;color:#9fb5c4;margin-left:10px}.wrap{padding:16px;display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.panel{background:#102332;border:1px solid #294253;border-radius:7px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid #294253;display:flex;justify-content:space-between;align-items:center}.body{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:11px;color:#9fb5c4;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#091722;border:1px solid #345061;color:#e8f0f5;border-radius:4px;padding:9px}.field textarea{min-height:80px}.btn{background:#1478bf;border:0;color:#fff;border-radius:4px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.green{background:#168b66}.btn.red{background:#c83b4b}.list{max-height:65vh;overflow:auto}.incident{padding:11px;border-bottom:1px solid #294253}.cat{display:inline-block;padding:3px 7px;border-radius:4px;font-weight:800;color:#fff}.c1{background:#db3e4d}.c2{background:#d29c25}.c3{background:#269e69}.c4{background:#398ac0}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.muted{color:#91a6b4;font-size:11px}.unit{padding:9px;border-bottom:1px solid #294253}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2bc38b;margin-right:7px}.dot.off{background:#87949c}.messages{max-height:260px;overflow:auto}.msg{padding:8px;border-bottom:1px solid #294253}.ok{color:#2bc38b}@media(max-width:900px){.wrap{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body><div class="top"><div class="brand">AMBULANCE CONTROL • BLACKPOOL</div><div class="sub">CAD / MDT TRAINING SYSTEM</div><div class="grow"></div><span class="ok" id="status">● Connected</span></div><main class="wrap">
<section class="panel"><div class="head"><b>Incident Queue</b><span id="count" class="muted">0</span></div><div class="list" id="incidents"></div></section>
<section>
<div class="panel"><div class="head"><b>Create Incident</b><button class="btn green" onclick="createJob()">Dispatch</button></div><div class="body grid"><div class="field"><label>Category</label><select id="cat"><option>C1</option><option>C2</option><option selected>C3</option><option>C4</option></select></div><div class="field"><label>Job type</label><input id="type" value="General Ambulance Incident"></div><div class="field" style="grid-column:1/-1"><label>Location</label><input id="addr" value="Blackpool, Lancashire"></div><div class="field"><label>Patient</label><input id="patient" value="1 adult"></div><div class="field"><label>Latitude / Longitude</label><input id="coords" value="53.8175,-3.0357"></div><div class="field" style="grid-column:1/-1"><label>Information</label><textarea id="info">New incident reported by caller.</textarea></div></div></div>
<div class="panel" style="margin-top:14px"><div class="head"><b>Units</b></div><div class="body" id="units"></div></div>
<div class="panel" style="margin-top:14px"><div class="head"><b>Control Message</b><button class="btn" onclick="sendMessage()">Send</button></div><div class="body"><div class="field"><input id="msg" placeholder="Message all MDTs"></div><div class="messages" id="messages"></div></div></div>
</section></main><script>
const socket=io();let incidents=[],units={},messages=[];socket.on('state:init',s=>{incidents=s.incidents||[];messages=s.messages||[];render()});socket.on('incident:new',i=>{incidents.unshift(i);render()});socket.on('incident:update',i=>{const n=incidents.findIndex(x=>x.id===i.id);if(n>=0)incidents[n]=i;else incidents.unshift(i);render()});socket.on('unit:update',u=>{units[u.id]=u;renderUnits()});socket.on('message:new',m=>{messages.unshift(m);renderMessages()});
function render(){document.getElementById('count').textContent=incidents.length;document.getElementById('incidents').innerHTML=incidents.slice(0,50).map(i=>`<div class="incident"><div class="row"><span class="cat c${i.cat.slice(1)}">${i.cat}</span><b class="grow">${i.type}</b><span class="muted">${i.time}</span></div><div>${i.addr}</div><div class="muted">${i.id} • ${i.status} • ${i.patient}</div><div style="margin-top:6px"><button class="btn" onclick="task('${i.id}','UNIT123')">Task Unit 123</button></div></div>`).join('');renderUnits();renderMessages()}
function renderUnits(){document.getElementById('units').innerHTML=Object.values(units).map(u=>`<div class="unit"><span class="dot ${u.status==='Disconnected'?'off':''}"></span><b>${u.callsign||u.id}</b> — ${u.role||'Crew'}<span class="muted"> • ${u.status}</span></div>`).join('')||'<span class="muted">No connected units.</span>'}
function renderMessages(){document.getElementById('messages').innerHTML=messages.slice(0,10).map(m=>`<div class="msg"><b>${m.from}</b> <span class="muted">${new Date(m.at).toLocaleTimeString('en-GB')}</span><br>${escapeHtml(m.text)}</div>`).join('')}
function createJob(){let [lat,lon]=document.getElementById('coords').value.split(',').map(Number);socket.emit('control:create',{cat:document.getElementById('cat').value,type:document.getElementById('type').value,addr:document.getElementById('addr').value,patient:document.getElementById('patient').value,info:document.getElementById('info').value,lat,lon});}
function task(id,unitId){const i=incidents.find(x=>x.id===id);if(!i)return;i.status='Assigned';i.assignedUnit=unitId;socket.emit('incident:update',i);socket.emit('incident:status',{id,status:'Assigned',unitId})}
function sendMessage(){const t=document.getElementById('msg').value.trim();if(!t)return;socket.emit('control:message',{to:'ALL',text:t});document.getElementById('msg').value=''}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
